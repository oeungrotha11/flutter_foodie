name: pos_product
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  carousel_slider: ^5.1.2
  flutter_svg: ^2.3.0
  flutter_rating_bar: ^4.0.1
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  lottie: ^3.5.1
  intl_phone_field: ^3.2.0
  http: ^1.5.0
  google_maps_flutter: ^2.14.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  web: ^1.1.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  flutter_launcher_icons: ^0.14.4
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Kantumruy_Pro/
    - assets/fonts/Poppins/
    - assets/images/
    - assets/svg/
    - assets/lotties/
  fonts:
    - family: Kantumruy Pro
      fonts:
        - asset: assets/fonts/Kantumruy_Pro/KantumruyPro-Variable.ttf
        - asset: assets/fonts/Kantumruy_Pro/KantumruyPro-Italic.ttf
          style: italic
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          style: italic
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/burger.png"
  min_sdk_android: 21
dependency_overrides:
  archive: ^4.4.0
